<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrito — Celulares Don Kikin</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="carrito">

<header class="encabezado" id="encabezado-sitio"></header>

<main class="contenedor">
  <div class="titulo-seccion"><h2>Tu carrito</h2></div>
  <div class="diseno-carrito">
    <div id="items-carrito"></div>
    <aside class="caja-resumen">
      <h3>Resumen del pedido</h3>
      <div class="fila-resumen"><span id="resumen-conteo">0 artículos</span><span id="resumen-subtotal">$0 MXN</span></div>
      <div class="fila-resumen"><span>Envío</span><span>Gratis</span></div>
      <div class="total-resumen"><span>Total</span><span class="precio" id="resumen-total">$0 MXN</span></div>
      <button class="boton-primario" style="width:100%;margin-top:16px;" id="boton-pagar">Finalizar compra</button>
      <a href="index.html" class="boton-secundario" style="display:block;text-align:center;margin-top:10px;">Seguir comprando</a>
    </aside>
  </div>
</main>

<footer class="pie-sitio">
  <div class="contenedor">Celulares Don Kikin</div>
</footer>

<script src="js/datos.js"></script>
<script src="js/comun.js"></script>
<script src="js/paginas.js"></script>
</body>
</html>
